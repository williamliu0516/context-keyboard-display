# context-keyboard-display configuration.
# Copied to ~/.claude/context-keyboard-display.yaml by --install; edit THAT file.

# Where the keyboard lives. THE ONE KEY YOU MUST SET: the panel's own address
# on your network. There is no useful default — it is whatever DHCP handed your
# keyboard — so the daemon refuses to push frames until you replace this.
# Find it on the keyboard's own display or settings app, or look for a new
# device in your router's client list.
url: http://PANEL-IP-NOT-SET/image/upload

# Seconds between renders while the daemon runs. The two screens that animate
# (Claude working / waiting) tick at 1 s regardless, so their stopwatch counts
# in real seconds and the mascot spins smoothly; this is the rate for the
# screens that hold still (idle, sessions, between-turns).
tick_seconds: 5.0
# Re-push an identical frame this often (covers a rebooted/slept panel).
heartbeat_seconds: 300.0
# After a failed POST, back off (growing to 60 s).
offline_backoff_seconds: 20.0
http_timeout_seconds: 4.0
jpeg_quality: 95

# A transcript that moved within this many seconds counts as actively working.
active_seconds: 45.0
# Sessions quieter than this stop existing for the display entirely.
session_ttl_seconds: 21600.0
# The engagement window: a session counts as part of your work (and toward the
# switchboard's "+N idle" line) for this long after its last activity.
engaged_seconds: 1800.0
# A finished session keeps its own switchboard row ("done 2m") this long. After
# that it folds into "+N idle", and when nothing is active the panel drops to
# the idle family (print, music, clock) instead of a stale DONE screen.
done_seconds: 300.0
# Minimum time a screen stays up before a non-urgent change replaces it. A
# session asking for permission, a home takeover, a hotkey, or a screen that
# has stopped being true all switch at once.
dwell_seconds: 15.0

# How long a manual override lasts ("peek" semantics). `display.py mode
# claude|sessions|idle` — and the hotkey's `mode next` — pin the panel to one
# screen; this many seconds after it was set, the override is forgotten and the
# panel falls back to `auto` on its own, so you never have to press your way
# back. `auto` never expires (it is the resting state). Want the old sticky
# behaviour? Set this to something huge, e.g. 86400.0.
override_ttl_seconds: 60.0

usage_poll_seconds: 60.0
diff_poll_seconds: 5.0

# homeboard (the household panel's backend) feeds the strip under the Claude
# screens and the home screens: a print in progress or failed, the next course
# deadline, what the speaker is playing, and health checks gone bad. Leave
# home_url empty to turn all of it off; the panel then shows clocks there.
# homeboard guards /api with a token: use its read-only KEYBOARD_TOKEN, put it
# alone in a file only you can read (chmod 600) and point home_token_file at it.
home_url: ""
home_token_file: ""
home_poll_seconds: 10.0
# A new home event (bad health check, failed print, deadline threshold) takes
# the whole screen this long; after that the strip carries it.
takeover_seconds: 60.0
# Deadlines show in the strip this many days out, and take the screen once at
# each of these thresholds.
due_strip_days: 3.0
due_takeover_hours: [48, 24, 6, 1]

# Where the claude-code-keyboard-status checkout lives (imported as a library).
upstream_path: ~/projects/claude-code-keyboard-status

display:
  # Per-project display names. The Sessions rows hold ~7 characters after the
  # state dot; name each repo you actually work in once, and anything not in
  # the map falls back to boundary-aware prefix truncation ("keyboard-display"
  # -> "keybo…"). Aliases apply everywhere a project name renders.
  aliases:
    claude-code-keyboard-status: kbd-sts
    context-keyboard-display: display
    context-keyboard-display-planning: plan
    # worldengine-api: we-api
    # worldengine-web: we-web

keys:
  # The global hotkeys (keys.py), vim-shaped. All must carry a real modifier:
  # that is what lets macOS reserve them outright, with no Input Monitoring
  # grant and no prompt. A bare letter would be registrable and catastrophic --
  # a reserved combination never reaches the app you are typing into, so
  # binding "k" alone would stop the letter k working everywhere on the machine.
  #
  # binding         (L) steps forward round the screen cycle below -- and,
  #                 while a session is drilled into, first steps back out to
  #                 the switchboard.
  # back_binding    (H) the same, backward.
  # select_binding  (J) drills into the switchboard and steps down its rows.
  # up_binding      (K) the same, up. J and K do nothing at all unless the
  #                 switchboard is the screen showing.
  binding: "ctrl+opt+cmd+l"
  back_binding: "ctrl+opt+cmd+h"
  select_binding: "ctrl+opt+cmd+j"
  up_binding: "ctrl+opt+cmd+k"
  cycle: [auto, claude, sessions, idle]
  # auto: swallow only bindings that carry real modifiers (the tap engine's
  # concern; a reserved Carbon hotkey is always swallowed either way).
  swallow: auto
  debounce_seconds: 0.35
